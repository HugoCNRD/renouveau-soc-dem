<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Agenda — Renouveau Social Démocrate</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <span class="burger" onclick="openNav()">&#9776;</span>
    <img src="RSD.jpg" alt="Logo RSD"> 
    <h1>Renouveau Social Démocrate</h1>
  </header>


  <div id="menu"></div>

  <section class="section">
    <h3>Agenda des événements</h3>
    <p>Retrouvez ici nos prochaines réunions, meetings et événements militants.</p>


    <div id="agenda-container" style="background:#fff; padding:20px; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,.1);">

      <iframe src="https://calendar.google.com/calendar/embed?src=fr.french%23holiday%40group.v.calendar.google.com&ctz=Europe%2FParis"
        style="border:0" width="100%" height="600" frameborder="0" scrolling="no"></iframe>

    </div>
  </section>

  <footer class="footer">
    <p>&copy; 2025 Renouveau Social Démocrate — Ensemble pour un meilleur avenir</p>
  </footer>

  <script>
    fetch("menu.html")
      .then(res => res.text())
      .then(data => { document.getElementById("menu").innerHTML = data; });

    function openNav() { document.getElementById("myNav").style.width = "100%"; }
    function closeNav() { document.getElementById("myNav").style.width = "0"; }
  </script>
</body>
</html>
